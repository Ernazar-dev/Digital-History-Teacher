# Render Blueprint — bitta web servis: Express backend frontend'ni (Vite dist) ham o'zi beradi.
# Shunda brauzer → bitta servis: alohida static site va /api rewrite proxy'si (qo'shimcha hop) yo'q.
# Baza — Neon PostgreSQL (DATABASE_URL Render panelida kiritiladi). Batafsil: DEPLOY.md
services:
  - type: web
    name: dht-backend
    runtime: node
    plan: free
    region: frankfurt # Neon loyihasini ham shu hududda oching (AWS eu-central-1)
    # Frontend ham, backend ham shu repodan quriladi (rootDir yo'q — ikkala papka kerak).
    # Dev-paketlar (prisma, typescript, tsx, vite) build uchun kerak — NODE_ENV=production bo'lsa ham o'rnatiladi.
    # Migratsiyalar har deployda qo'llanadi; boshlang'ich ma'lumotlar faqat baza bo'sh bo'lganda yuklanadi.
    # Frontend (vite build) ~900 MB heap talab qiladi — Render free build konteyneriga sig'maydi (OOM).
    # Shuning uchun yig'ilgan frontend/dist repoda saqlanadi (`npm run build:frontend`, keyin commit);
    # dist yo'q bo'lsagina Render o'zi quradi.
    buildCommand: >-
      cd frontend && { [ -f dist/index.html ] || { npm ci --include=dev && npm run build; }; }
      && cd ../backend && npm ci --include=dev && npx prisma generate && npm run build
      && npx prisma migrate deploy && npm run db:seed:if-empty && npm run db:seed:lectures && npm run db:seed:objects
    startCommand: cd backend && npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon to'g'ridan-to'g'ri connection string (sslmode=require) — migratsiya/seed uchun
        sync: false
      - key: DATABASE_POOLED_URL # Neon pooled (-pooler) connection string — ishlayotgan server shu orqali ulanadi
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD # kamida 10 belgi
        sync: false
      - key: ADMIN_FULL_NAME
        value: Administrator
      - key: CORS_ORIGINS # servisning o'z manzili, masalan https://dht-backend.onrender.com
        sync: false
      # Backend yig'ilgan frontend'ni shu papkadan beradi (cwd = backend)
      - key: FRONTEND_DIST_DIR
        value: ../frontend/dist
      # Render free diski vaqtinchalik — yuklangan fayllar bazada saqlanadi
      - key: STORAGE_DRIVER
        value: database
      # Mijoz → Cloudflare → Render ichki proxy → backend (x-forwarded-for: mijoz, cloudflare, 10.x).
      # Haqiqiy mijoz IP'si (rate limit uchun) 3-sakrashda — 1 bo'lsa hamma bitta ichki IP bo'lib qoladi
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: UPLOAD_MAX_MB
        value: "50"
      - key: LOG_LEVEL
        value: info
      - key: API_DOCS_ENABLED
        value: "false"
